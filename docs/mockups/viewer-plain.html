/* Layout: the old kerjaan viewer's look (navy panels, condensed type, one colour per status), filling the window; only panels scroll. */
:root {
  --ground: #eef1f6; --panel: #ffffff; --sunk: #e6eaf1; --ink: #172033; --muted: #5b6680; --faint: #b9c2d3; --line: #dde2ec; --accent: #1e7bd6;
  --backlog: #767ca6; --todo: #1e7bd6; --in_progress: #c77800; --review: #8a4ad6; --done: #138f67; --cancel: #c2513b;
  --warn-bg: #fff4e0; --warn-ink: #8a5300; --warn-line: #f0d39a; --ok: #138f67; --ok-bg: #e2f5ee; --bad: #d1342f; --bad-bg: #fde8e6;
  --shadow: 0 6px 24px rgba(20,30,55,.12);
  --sans: "IBM Plex Sans Condensed", "Arial Narrow", ui-sans-serif, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --ground: #0c111c; --panel: #141b2b; --sunk: #101626; --ink: #e3e9f5; --muted: #8b96b0; --faint: #3d4862; --line: #232d44; --accent: #5fb2ff;
  --backlog: #9ba1c9; --todo: #5fb2ff; --in_progress: #ffb547; --review: #c28cff; --done: #3fcf9d; --cancel: #e57a62;
  --warn-bg: #2f2410; --warn-ink: #ffcf87; --warn-line: #5c4418; --ok: #3fcf9d; --ok-bg: #10302a; --bad: #ff6b5e; --bad-bg: #4a1714;
  --shadow: 0 8px 30px rgba(0,0,0,.45); color-scheme: dark } }
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--faint) transparent }
html, body { margin: 0 }
body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: var(--ground); color: var(--ink); font: 14px/1.4 var(--sans) }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
h1, h2, h3, p, ol, ul, dl, dd { margin: 0; padding: 0 }
[hidden] { display: none !important }
a { color: var(--accent) }

.caption { font-size: 12px; color: var(--muted) }
.stencil { font: 600 15px var(--sans) }
.sample { font: 9.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px dashed var(--faint); border-radius: 3px; padding: 0 4px; white-space: nowrap }
.idno { font: 11px var(--mono); color: var(--muted); white-space: nowrap } .idno b { color: var(--ink); font-weight: 500 }
.linkish { border: 0; background: none; padding: 0; text-align: left; font: inherit; color: inherit } .linkish:hover { color: var(--accent) }

a pesan bila nomor sudah dipakai?","sub":["→ Otomatis (Recommended) — dibuat sendiri oleh program (owner, 2026-11-12)"]},{"key":"Q2","status":"answered","text":"Bentuk nomor bukti otomatis? (a) awalan + nomor urut berisi nol di depan, misalnya BKT-0001 (bila lewat 9999 menjadi BKT-10000); (b) dengan tahun dari tanggal transaksi, misalnya BKT/2026/0001, urutan mulai lagi tiap tahun; (c) angka saja, sama dengan nomor transaksi. Saran: (a) diturunkan dari nomor transaksi (#5 menjadi BKT-0005), sehingga buku lama yang dibuka dua kali selalu mendapat nomor yang sama dan nomor tidak pernah bergeser. Awalan apa yang Anda mau, BKT atau yang lain?","sub":["→ BKT-0001 (Recommended) — diambil dari nomor transaksi (owner, 2026-11-12)"]},{"key":"Q3","status":"answered","text":"Kapan buku lama diperbarui di berkas? (a) nomor bukti ditambahkan saat buku dibaca, tetapi berkas baru ditulis ketika ada perintah yang memang mengubah buku (catat, batalkan, tambah-akun, ...); perintah lihat seperti daftar-transaksi tidak menulis berkas; (b) berkas langsung ditulis ulang begitu dibuka oleh perintah apa pun; (c) seperti (b) tetapi salinan berkas lama disimpan dulu (misalnya buku.json.bak). Saran: (a), karena perintah lihat tetap tidak menyentuh berkas dan nomor yang diturunkan dari nomor transaksi selalu sama, jadi hasilnya sama dengan (b) tanpa risiko menulis berkas.","sub":["→ Saat ada perubahan (Recommended) — nomor ditambahkan saat dibaca; berkas hanya ditulis oleh perintah yang mengubah data (owner, 2026-11-12)"]},{"key":"Q4","status":"answered","text":"Di mana nomor bukti tampil dan dipakai? Tiket menyebut daftar transaksi dan buku besar. Saran: juga di pesan sesudah 'akun catat' dan 'akun batalkan' (misalnya 'Transaksi #5 (BKT-0005) dicatat ...'), sedangkan 'akun batalkan' tetap menerima nomor transaksi (#), bukan nomor bukti, dan keterangan pembalik tetap 'Pembatalan transaksi #n'. Alternatif: 'batalkan' juga menerima nomor bukti. Mana yang Anda mau?","sub":["→ Juga di pesan (Recommended) — daftar transaksi, buku besar, dan pesan konfirmasi catat dan batalkan; batalkan tetap memakai nomor transaksi (#n) (owner, 2026-11-12)"]}],"assumptions":[],"decisions":[{"text":"Lane strict: mengubah bentuk data tersimpan dan memigrasi buku.json yang sudah ada; kesalahan bisa merusak data pembukuan.","sub":[]},{"text":"Solo: groundwork. Menambah field baru di setiap transaksi dan migrasi buku lama di muat(); 261112050403 membaca field ini, jadi tiket ini jalan sendiri dan paling dulu.","sub":[]},{"text":"Red-proof: migrasi di muat dihapus, bukti tersimpan ditimpa saat muat, cek nomor bukti kembar di catatTransaksi, format padStart, bukti tidak diisi di catatTransaksi, simpan ditambahkan di daftar-transaksi dan di buku-besar; all red","sub":[]},{"text":"Nomor bukti disimpan sebagai field 'bukti' tepat sesudah 'nomor'; muat() mengisinya hanya untuk transaksi yang belum punya, jadi nomor bukti yang sudah tersimpan tidak pernah diganti.","sub":[]}],"manual":[],"handoff":"Setiap transaksi kini punya field 'bukti' (BKT- + nomor transaksi, nol di depan sampai 4 angka) lewat nomorBukti() di src/buku.mjs. catatTransaksi mengisinya dan menolak bila bukti sudah dipakai; pembalik ikut mendapatkannya karena lewat catatTransaksi. muat() memberi bukti hanya di memori untuk transaksi lama yang belum punya, dan tidak pernah mengganti bukti yang tersimpan; berkas baru berubah saat perintah pengubah memanggil simpan. Perintah tampilan tidak boleh memanggil simpan. Tampilan: daftar-transaksi '#n  BKT-xxxx  tanggal ...', buku-besar kolom Bukti sesudah No., pesan catat dan batalkan menyebut bukti. bukuBesar() membawa 'bukti' per baris.","review":[{"text":"2026-11-12 strict, round 1, at c954949: passed.","sub":["1: catatTransaksi mengisi bukti=nomorBukti(nomor) dan menolak bila kembar; uji 12 transaksi unik; mutasi: cek kembar dihapus -> 1 uji merah","2: daftar-transaksi '#n BKT-xxxx ...' dan kolom Bukti buku-besar diuji lewat perintah di bukti.test, buku.test, batal.test, tutup     </details>`;
  }).join('');

  const units = running().map((t) => {
    const r = t.run;
    const frac = (ts(D.now) - ts(r.since)) / (STUCK_MIN * 60000);
    const test = r.test ? `<details><summary><span class="dim">tests</span> running <span data-since="${ts(r.test.since)}"></span> <span class="dim">·</span> <span class="q" data-quiet="${r.test.quiet}">last output <span class="qv"></span> ago</span> <span class="dim">▸ output</span></summary><pre class="dim">${esc(r.test.tail.join('\n'))}</pre></details>` : '';
    return `<article class="unit ${r.note ? 'warn' : ''}">
      <div class="head"><button class="label" data-open="${t.id}">${esc(t.title)}</button><span class="el" title="on this step; the foreman calls it stuck at ${STUCK_MIN} min"><span data-clock="${ts(r.since)}"></span><small> / ${STUCK_MIN}:00</small></span></div>
      <div class="meter"><i style="width:${Math.min(100, frac * 100).toFixed(1)}%"></i></div>
      <div class="main" style="display:contents">
        <div class="row"><span class="role"><span class="lamp blink ${r.note ? 'amber' : ''}"></span>${esc(r.role)}</span>${idno(t.id)} ${laneTag(t.fm.lane)} <span class="tag">${esc(r.model)}</span> ${t.state.round > 1 ? `<span class="tag">round ${t.state.round}</span>` : ''} ${indicators(t)} ${sampleTag(t)}</div>
        <div class="lcd">
          ${r.note ? `<p class="amber">! ${esc(r.note)}</p>` : ''}
          <p>${esc(r.step)} <span class="dim">· <span data-since="${ts(r.stepAt)}"></span> ago</span></p>
          <p class="cmd">$ ${esc(r.command)}</p>
          ${test}
        </div>
        <p class="wt">${esc(t.worktree)}${t.state.slot ? ` · slot ${t.state.slot}` : ''}</p>
      </div>
    </article>`;
  }).join('');

  const todo = D.queue.order.map((id) => byId.get(id)).filter(Boolean);
  const todoWhy = (t, i) => {
    const waits = t.fm.blocked_by.filter((b) => byId.get(b)?.status !== 'done');
    if (waits.length) return [`starts after ${waits.map((w) => w.slice(8)).join(', ')} lands`, true];
    if (t.fm.solo === 'true') return ['solo: starts when nothing else is running', true];
    if (D.queue.pause.includes(t.id)) return ['pause before: waits for your go', true];
    return [i === 0 ? 'starts when a place is free' : 'in line', false];
  };
  const mq = D.mergeQueue.map((id) => byId.get(id));
  const held = D.tickets.filter((t) => t.status === 'review' && t.state.passed && t.state.held);
  const link = (t, node, why, hold) => `<li><span class="node ${node.cls}">${node.text}</span><div>
      <button class="linkish ct" data-open="${t.id}">${esc(t.title)}</button>
      <div class="row">${idno(t.id)} ${laneTag(t.fm.lane)} ${sampleTag(t)}</div>
      <p class="why ${hold ? 'hold' : ''}">${esc(why)}</p></div></li>`;

  return `<div class="room">
    <section class="plate bay needs">
      <div class="bay-head"><h2 class="stencil">Waiting for you</h2><span class="rule"></span><span class="num">${items.length}</span></div>
      <div class="sheets">${sheets}</div>
      <p class="clip-foot">read only · settle these in your Claude session: “manual check 2502 passed”, “confirm the assumptions of 1502”</p>
    </section>
    <section class="plate bay running">
      <div class="bay-head"><h2 class="stencil">Running now</h2><span class="rule"></span><span class="num">${running().length}<small> of ${D.settings.max_parallel} places</small></span></div>
      <div class="rack">${units || '<p class="caption">No agent is working.</p>'}</div>
    </section>
    <div class="right">
      <section class="plate bay mq">
        <div class="bay-head"><h2 class="stencil">Merge queue</h2><span class="rule"></span><span class="num">${mq.length}<small> passed</small></span></div>
        <ol class="chain">
          ${mq.map((t, i) => link(t, { cls: i === 0 ? 'go' : '', text: i + 1 }, i === 0 ? (t.state.needs ? `holds the turn · its ${t.state.needs} is bringing main in` : 'holds the turn · ready to land') : `lands after ${mq[0].id.slice(8)}`, false)).join('')}
          ${held.map((t) => link(t, { cls: 'off', text: '–' }, `out of the queue · held: ${t.state.held}`, true)).join('')}
        </ol>
      </section>
      <section class="plate bay nx">
        <div class="bay-head"><h2 class="stencil">Next up</h2><span class="rule"></span><span class="num">${todo.length}<small> todo</small></span></div>
        <p class="goal">goal · ${esc(D.queue.goal)}</p>
        <ol class="chain">${todo.map((t, i) => { const [why, hold] = todoWhy(t, i); return link(t, { cls: '', text: i + 1 }, why, hold); }).join('')}</ol>
      </section>
    </div>
  </div>`;
}

// ----- board -----
const STATUSES = ['backlog', 'todo', 'in_progress', 'review', 'done', 'cancel'];
const FOOT = { backlog: 'ideas', todo: 'ready', in_progress: 'at work', review: 'judged here', done: 'on main', cancel: 'dropped' };
const ui = { q: '', lane: '', hide: new Set(['cancel']) };
const pills = (t) => { const c = t.criteria; return c.length ? `<span class="pills" title="Done when">${c.map((x) => `<i class="${x.void ? 'void' : x.done ? 'done' : ''}"></i>`).join('')}<b>${c.filter((x) => x.done).length}/${c.filter((x) => !x.void).length}</b></span>` : ''; };
document.addEventListener('click', (e) => { const b = e.target.closest('[data-col]'); if (!b) return; ui.hide.has(b.dataset.col) ? ui.hide.delete(b.dataset.col) : ui.hide.add(b.dataset.col); render(); });
function fileState(t) {
  if (t.run) return `<span class="state"><span class="lamp blink"></span>${esc(t.run.role)} · <span data-since="${ts(t.run.since)}"></span></span>`;
  if (t.status === 'review' && t.state.held) return `<span class="state"><span class="lamp amber"></span>held for you</span>`;
  if (t.status === 'review' && t.state.passed) return `<span class="state">merge queue no. ${D.mergeQueue.indexOf(t.id) + 1}</span>`;
  if (t.status === 'todo') { const i = D.queue.order.indexOf(t.id); return i >= 0 ? `<span class="state">queue no. ${i + 1}</span>` : ''; }
  return '';
}
function viewBoard() {
  const match = (t) => (!ui.lane || t.fm.lane === ui.lane) && (!ui.q || t.title.toLowerCase().includes(ui.q.toLowerCase()) || t.id.includes(ui.q));
  const cols = STATUSES.filter((s) => !ui.hide.has(s)).map((s, i) => {
    let list = D.tickets.filter((t) => t.status === s && match(t));
    if (s === 'done') list = list.sort((a, b) => (ev(b, 'landed')[0]?.t || '').localeCompare(ev(a, 'landed')[0]?.t || ''));
    if (s === 'todo') list = list.sort((a, b) => D.queue.order.indexOf(a.id) - D.queue.order.indexOf(b.id));
    return `<section class="plate locker" data-s="${s}">
      <div class="vents"></div>
      <div class="locker-head"><div><p class="caption">locker ${String(i + 1).padStart(2, '0')}</p><h3 class="stencil">${s.replace('_', ' ')}</h3></div><span class="knob">${list.length}</span></div>
      <div class="well">${list.map((t) => `<button class="file" data-open="${t.id}">
          <span class="toprow"><span>${idno(t.id)}</span><span>${esc(t.fm.type)}${t.fm.priority !== 'medium' ? ' · ' + esc(t.fm.priority) : ''}</span></span>
          <span class="ft">${esc(t.title)}</span>
          <span class="row">${laneTag(t.fm.lane)}${t.fm.solo === 'true' ? '<span class="tag">solo</span>' : ''} ${sampleTag(t)}${pills(t)}</span>
          ${stamps(t) ? `<span class="row">${stamps(t)}</span>` : ''}
          ${fileState(t)}
        </button>`).join('') || '<p class="none">empty</p>'}</div>
      <div class="locker-foot"><span class="nameplate">${FOOT[s]}</span><span class="handle"></span></div>
    </section>`;
  }).join('');
  return `<div class="plate toolbar">
      
      <input class="field" type="search" id="f-q" placeholder="Search title or ID…" value="${esc(ui.q)}" aria-label="Filter by title or ID">
      <select class="field" id="f-lane" aria-label="Lane"><option value="">all lanes</option>${['light', 'standard', 'strict'].map((l) => `<option ${ui.lane === l ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <span class="caption">Columns</span>${STATUSES.map((s) => `<button class="colbtn" data-s="${s}" data-col="${s}" aria-pressed="${!ui.hide.has(s)}"><i></i>${s.replace('_', ' ')} <b>${D.tickets.filter((t) => t.status === s).length}</b></button>`).join('')}
    </div>
    <div class="lockers">${cols}</div>`;
}

// ----- history -----
function viewHistory() {
  const done = D.tickets.filter((t) => t.status === 'done').map((t) => {
    const started = ev(t, 'started')[0]?.t, landed = ev(t, 'landed')[0]?.t;
    return { t, landed, ms: ts(landed) - ts(started), rejected: ev(t, 'verdict').filter((v) => v.result !== 'pass').length, integ: Math.max(ev(t, 'integrate').length, ev(t, 'integrated').length) };
  }).sort((a, b) => b.landed.localeCompare(a.landed));
  const med = (list) => list.map((d) => d.ms).sort((a, b) => a - b)[Math.floor(list.length / 2)] || 0;
  const rej = done.filter((d) => d.rejected).length, integ = done.filter((d) => d.integ).length;
  const days = [...new Set(done.map((d) => d.landed.slice(0, 10)))];
  const lanes = ['light', 'standard', 'strict'];
  const max = Math.max(...days.map((day) => done.filter((d) => d.landed.startsWith(day)).length), 1);
  const dayRows = days.map((day) => { const list = done.filter((d) => d.landed.startsWith(day)); return `<div class="barrow"><span>${day.slice(5)}</span><div class="ink-bar" style="width:${(list.length / max) * 100}%">${lanes.map((l) => { const n = list.filter((d) => d.t.fm.lane === l).length; return n ? `<div class="${l}" style="flex:${n}" title="${l} ${n}"></div>` : ''; }).join('')}</div><b>${list.length}</b></div>`; }).join('');
  const lmax = Math.max(...lanes.map((l) => done.filter((d) => d.t.fm.lane === l).length), 1);
  const laneRows = lanes.map((l) => { const list = done.filter((d) => d.t.fm.lane === l); return `<div class="barrow"><span>${l}</span><div class="ink-bar" style="width:${(list.length / lmax) * 100}%"><div class="${l}" style="flex:1"></div></div><b>${list.length}</b></div><p style="margin:-6px 0 10px;font-size:13px;color:var(--ink-dim)">median ${dur(med(list))} start to main</p>`; }).join('');
  const rows = days.map((day) => `<tr class="day"><td colspan="6">${day}</td></tr>` + done.filter((d) => d.landed.startsWith(day)).map((d) => `<tr>
      <td>${d.landed.slice(11, 16)}</td>
      <td><button class="linkish" data-open="${d.t.id}">${esc(d.t.title)}</button> ${stamps(d.t)}</td>
      <td>${idno(d.t.id)}</td><td>${esc(d.t.fm.lane)}</td>
      <td class="num">${dur(d.ms)}</td><td class="num">${d.rejected || '–'}</td><td class="num">${d.integ || '–'}</td></tr>`).join('')).join('');
  const m = med(done), mm = clockFmt(m);
  return `<div class="hist"><div class="hist-left"><div class="plate dials">
      <div class="dial"><span class="counter">${cells(String(done.length).padStart(2, '0'))}</span><span class="caption">landed on main</span></div>
      <div class="dial"><span class="counter">${cells(mm)}</span><span class="caption">median start to main</span></div>
      <div class="dial"><span><span class="counter">${cells(String(rej).padStart(2, '0'))}</span> <span class="of">of ${done.length}</span></span><span class="caption">rejected once or more</span></div>
      <div class="dial"><span><span class="counter">${cells(String(integ).padStart(2, '0'))}</span> <span class="of">of ${done.length}</span></span><span class="caption">brought main in</span></div>
    </div>
        <section class="ledger"><h3>Landed per day</h3>${dayRows}<div class="key"><span><i class="light"></i>light</span><span><i class="standard"></i>standard</span><span><i class="strict"></i>strict</span></div></section>
        <section class="ledger"><h3>By lane</h3>${laneRows}</section>
      </div>
      <section class="ledger book"><h3>Log of landed tickets</h3>
        <div class="tablewrap"><table><thead><tr><th>Time</th><th>Ticket</th><th>No.</th><th>Lane</th><th class="num">Start to main</th><th class="num">Rejected</th><th class="num">Main brought in</th></tr></thead><tbody>${rows}</tbody></table></div>
      </section>
    </div>`;
}

// ----- dossier -----
const EVENTS = {
  created: (e) => ['Created', `in ${e.status || 'backlog'}`], moved: (e) => ['Moved', `to ${e.to}${e.forced ? ' (forced)' : ''}`],
  started: (e) => ['Work started', `branch ${e.branch} from ${e.base}`], agent: (e) => [`${e.role} dispatched`, `agent ${e.agent} · step ${e.step}`],
  test: (e) => [e.exit === 0 ? 'Tests passed' : 'Tests failed', `${e.command} · ${e.seconds}s${e.fingerprint ? ` · content ${e.fingerprint.slice(0, 8)}` : ''}`, e.exit === 0 ? 'good' : 'bad'],
  check: (e) => [`Item ${e.n} proven`, e.evidence], uncheck: (e) => [`Item ${e.n} unchecked`, ''], void: (e) => [`Item ${e.n} voided`, e.reason || ''],
  manual: (e) => [`Manual check ${e.key} written`, `for item ${e.n}`, 'warn'], 'manual-ok': (e) => [`Manual check ${e.key} passed`, '', 'good'], 'manual-failed': (e) => [`Manual check ${e.key} failed`, '', 'bad'],
  question: (e) => [`Question ${e.key}${e.blocking ? ' (blocking)' : ''}`, '', 'warn'], answer: (e) => [`Question ${e.key} answered`, ''],
  assumption: (e) => [`Assumption ${e.key} recorded`, '', 'warn'], 'assumption-confirmed': (e) => [`Assumption ${e.key} confirmed`, '', 'good'], 'assumption-overturned': (e) => [`Assumption ${e.key} overturned`, '', 'bad'],
  conflict: (e) => ['Conflict with main', (e.files || []).join(', '), 'warn'], submitted: (e) => ['Handed over', `${e.commit} · ${e.files} files · lane ${e.lane}`],
  verdict: (e) => [e.result === 'pass' ? `Passed review, round ${e.round}` : `Rejected, round ${e.round}`, `at ${e.commit}`, e.result === 'pass' ? 'good' : 'bad'],
  integrate: (e) => ['Main moved: bringing it in', e.needs ? `needs the ${e.needs}` : ''], integrated: () => ['Main brought in', ''],
  held: (e) => ['Merge held', e.why || '', 'warn'], landed: (e) => ['Landed on main', `${(e.files || []).length} files`, 'good'],
  accepted: () => ['Accepted by the owner', ''], amended: () => ['Contract amended', ''], released: (e) => [`${e.role || 'agent'} released`, ''], retry: () => ['Retried', ''],
};
const SECS = [['assumptions', 'Assumptions'], ['questions', 'Questions'], ['manual', 'Manual checks'], ['followups', 'Follow-ups'], ['decisions', 'Decisions'], ['review', 'Review']];
const OPEN = ['unseen', 'open', 'blocking', 'waiting'];
function paneContract(t) {
  const sec = (title, body) => (body ? `<div><h3>${title}</h3>${body.split(/\n{2,}/).map((p) => `<p>${rich(p)}</p>`).join('')}</div>` : '');
  const crit = t.criteria.length ? `<div><h3>Done when · ${t.criteria.filter((c) => c.done).length} of ${t.criteria.filter((c) => !c.void).length}</h3><ul class="crit">${t.criteria.map((c) => `<li><span class="tick ${c.done ? 'done' : ''}"></span><span class="${c.void ? 'void' : ''}">${c.owner ? '<span class="ownermark">OWNER</span>' : ''}${rich(c.text.replace(/^\(owner\)\s*/i, ''))}</span></li>`).join('')}</ul></div>` : '';
  const list = (a) => (a && a.length ? a.map(rich).join(', ') : '–');
  return `${sec('Background', t.sections.background)}${sec('How to reproduce', t.sections.repro)}${sec('Request', t.sections.request)}${crit}${sec('Out of scope', t.sections.scope)}
    <div><h3>Details</h3><dl class="mgrid">
      <dt>Type</dt><dd>${esc(t.fm.type)} · ${esc(t.fm.priority)} priority${t.fm.solo === 'true' ? ' · solo' : ''}</dd>
      <dt>Created</dt><dd>${esc(t.fm.created)}</dd><dt>Blocked by</dt><dd>${list(t.fm.blocked_by)}</dd><dt>Related</dt><dd>${list(t.fm.related)}</dd>
      <dt>Touches</dt><dd>${t.fm.touches.length ? esc(t.fm.touches.join(', ')) : '–'}</dd>${t.worktree ? `<dt>Worktree</dt><dd>${esc(t.worktree)}</dd>` : ''}
    </dl></div>`;
}
function paneRecord(t) {
  const stampOf = (s) => `<span class="stamp ${['confirmed', 'answered', 'ok', 'ticketed'].includes(s) ? 'green' : OPEN.includes(s) ? '' : 'blue'}">${esc(s)}</span>`;
  const out = SECS.map(([key, title]) => {
    const list = t.record[key];
    if (!list.length) return '';
    return `<div><h3>${title}</h3>${list.map((e) => `<div class="entry ${OPEN.includes(e.status) ? 'open' : ''}">
      ${e.key ? `<div class="eh"><span class="key2">${e.key}</span>${stampOf(e.status)}</div>` : ''}
      <p>${rich(e.text)}</p>${(e.sub || []).map((s) => `<p class="subl">${rich(s)}</p>`).join('')}</div>`).join('')}</div>`;
  }).join('');
  const hand = t.record.handoff ? `<div><h3>Handoff</h3><p>${rich(t.record.handoff)}</p></div>` : '';
  return out + hand || '<p>Nothing recorded yet.</p>';
}
function paneTimeline(t) {
  let day = '';
  return `<ol class="log">${t.log.map((e) => {
    const [what, det, tone] = (EVENTS[e.event] || (() => [e.event, '']))(e);
    const d = e.t.slice(0, 10), head = d !== day ? `<li class="dayhead">${d}</li>` : '';
    day = d;
    return `${head}<li><time>${e.t.slice(11)}</time><span class="hole ${tone || ''}"></span><div><b>${esc(what)}</b>${det ? `<div class="det">${esc(det)}</div>` : ''}${e.by ? `<div class="det">by ${esc(e.by)}</div>` : ''}</div></li>`;
  }).join('')}</ol>`;
}
const PANES = { contract: ['Contract', paneContract], record: ['Record', paneRecord], timeline: ['Timeline', paneTimeline] };
let drawer = null;
function renderDrawer() {
  const root = $('#drawer-root');
  if (!drawer) { root.innerHTML = ''; return; }
  const t = byId.get(drawer.id);
  const open = ['questions', 'assumptions', 'manual', 'followups'].reduce((n, k) => n + t.record[k].filter((e) => OPEN.includes(e.status)).length, 0);
  root.innerHTML = `<div class="scrim" data-close></div>
    <aside class="dossier" role="dialog" aria-modal="true" aria-label="Ticket ${t.id}">
      <div class="dossier-top"><div style="flex:1;min-width:0"><p class="fileno">File ${t.id}</p><h2>${esc(t.title)}</h2></div><span class="stamp big ${t.status === 'done' ? 'green' : t.status === 'cancel' ? '' : 'blue'}">${t.status.replace('_', ' ')}</span><button class="xbtn" data-close aria-label="Close">✕</button></div>
      <div class="dossier-meta">${laneTag(t.fm.lane)} ${stamps(t)} ${sampleTag(t)}</div>
      <div class="ftabs" role="tablist">${Object.entries(PANES).map(([k, [label]]) => `<button class="ftab" role="tab" aria-selected="${drawer.pane === k}" data-pane-tab="${k}">${label}${k === 'record' && open ? `<span class="n">${open} open</span>` : ''}${k === 'timeline' ? `<span class="n">${t.log.length}</span>` : ''}</button>`).join('')}</div>
      <div class="page">${PANES[drawer.pane][1](t)}</div>
    </aside>`;
  $('.xbtn', root).focus();
}

// ----- shell -----
const VIEWS = { control: viewControl, board: viewBoard, history: viewHistory };
let tab = 'control';
function render() {
  $('#view').innerHTML = VIEWS[tab]();
  for (const b of document.querySelectorAll('.sw')) { const on = b.dataset.tab === tab; b.setAttribute('aria-selected', on);  }
  tick();
}
function tick() {
  const n = now();
  for (const el of document.querySelectorAll('[data-since]')) el.textContent = dur(n - Number(el.dataset.since));
  for (const el of document.querySelectorAll('[data-clock]')) el.textContent = clockFmt(n - Number(el.dataset.clock));
  for (const el of document.querySelectorAll('[data-quiet]')) {
    const q = (Number(el.dataset.quiet) + Math.floor((Date.now() - T0) / 1000)) % 14; // the mockup pretends output keeps arriving
    $('.qv', el).textContent = `${q}s`;
    el.className = `q ${q >= 300 ? 'red' : q >= 60 ? 'amber' : ''}`;
  }
  const d = new Date(n);
  $('#clock').textContent = (`${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`);
}
function route() {
  const h = location.hash.slice(1);
  if (h.startsWith('ticket-') && byId.has(h.slice(7))) drawer = { id: h.slice(7), pane: drawer?.pane || 'contract' };
  else { drawer = null; if (VIEWS[h]) tab = h; }
  render();
  renderDrawer();
}
document.addEventListener('click', (e) => {
  const open = e.target.closest('[data-open]');
  if (open) { drawer = { id: open.dataset.open, pane: open.dataset.pane || 'contract' }; location.hash = `ticket-${open.dataset.open}`; renderDrawer(); return; }
  if (e.target.closest('[data-close]')) { location.hash = tab; return; }
  const pt = e.target.closest('[data-pane-tab]');
  if (pt) { drawer.pane = pt.dataset.paneTab; renderDrawer(); return; }
  const tb = e.target.closest('.sw');
  if (tb) location.hash = tb.dataset.tab;
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && drawer) location.hash = tab; });
document.addEventListener('input', (e) => {
  if (e.target.id === 'f-q') { ui.q = e.target.value; const pos = e.target.selectionStart; render(); const el = $('#f-q'); el.focus(); el.setSelectionRange(pos, pos); }
  if (e.target.id === 'f-lane') { ui.lane = e.target.value; render(); }
  if (e.target.id === 'f-cancel') { ui.cancel = e.target.checked; render(); }
});
$('#project').innerHTML = D.projects.map((p) => `<option>${esc(p)}</option>`).join('');
$('#project-name').textContent = D.project;
$('#n-run').innerHTML = `${running().length}<small>/${D.settings.max_parallel}</small>`;
{ const today = D.now.slice(0, 10); $('#n-landed').textContent = String(D.tickets.filter((t) => ev(t, 'landed')[0]?.t.startsWith(today)).length); $('#n-wt').innerHTML = `${D.tickets.filter((t) => t.worktree).length}<small> · ${D.orphans.length} orphan</small>`; $('#n-test').textContent = D.locks.length ? D.locks[0].ticket.slice(8) : 'free'; }
$('#n-need').textContent = inbox().length;
window.addEventListener('hashchange', route);
setInterval(tick, 1000);
route();
</script>
</body>
</html>
